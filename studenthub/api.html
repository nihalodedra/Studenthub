<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 13 - Student CRUD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #263b80;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 9px 14px;
            margin: 4px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #263b80;
            color: white;
        }

        .delete {
            background: #d93636;
        }

        .edit {
            background: #16834a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #263b80;
            color: white;
        }

        #message {
            margin-top: 12px;
            color: #16834a;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Student Management System</h1>
    <p>Add, view, edit, and delete students without page reload.</p>

    <form id="studentForm">
        <input type="hidden" id="studentId">

        <input type="text" id="name" placeholder="Student Name" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="text" id="course" placeholder="Course Name" required>

        <button type="submit" id="saveButton">Add Student</button>
        <button type="button" id="cancelButton" hidden>Cancel Edit</button>
    </form>

    <p id="message" role="status"></p>

    <h2>Student Records</h2>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentList"></tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById("studentForm");
    const studentId = document.getElementById("studentId");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const courseInput = document.getElementById("course");
    const studentList = document.getElementById("studentList");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    // Send requests to the PHP API
    async function sendRequest(action, data = {}) {
        const response = await fetch("api.php?action=" + action, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Request failed.");
        }

        return result;
    }

    // Load students from the database
    async function loadStudents() {
        try {
            const response = await fetch("api.php?action=list");
            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(result.message || "Could not load students.");
            }

            studentList.replaceChildren();

            result.students.forEach(function(student) {
                const row = document.createElement("tr");

                [student.id, student.name, student.email, student.course]
                    .forEach(function(value) {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                const actionCell = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit";
                editButton.addEventListener("click", function() {
                    editStudent(student);
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";
                deleteButton.addEventListener("click", function() {
                    deleteStudent(student.id);
                });

                actionCell.append(editButton, deleteButton);
                row.appendChild(actionCell);
                studentList.appendChild(row);
            });
        } catch (error) {
            message.textContent = error.message;
        }
    }

    // Add or update a student
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const id = studentId.value;

        const data = {
            name: nameInput.value.trim(),
            email: emailInput.value.trim(),
            course: courseInput.value.trim()
        };

        const action = id ? "update" : "add";

        if (id) {
            data.id = Number(id);
        }

        try {
            const result = await sendRequest(action, data);

            message.textContent = result.message;

            if (result.success) {
                form.reset();
                studentId.value = "";
                saveButton.textContent = "Add Student";
                cancelButton.hidden = true;
                await loadStudents();
            }
        } catch (error) {
            message.textContent = error.message;
        }
    });

    // Fill the form to edit a student
    function editStudent(student) {
        studentId.value = student.id;
        nameInput.value = student.name;
        emailInput.value = student.email;
        courseInput.value = student.course;

        saveButton.textContent = "Update Student";
        cancelButton.hidden = false;
        message.textContent = "Editing student ID " + student.id;
    }

    // Delete a student
    async function deleteStudent(id) {
        if (!confirm("Are you sure you want to delete this student?")) {
            return;
        }

        try {
            const result = await sendRequest("delete", { id: Number(id) });
            message.textContent = result.message;

            if (result.success) {
                await loadStudents();
            }
        } catch (error) {
            message.textContent = error.message;
        }
    }

    // Cancel editing
    cancelButton.addEventListener("click", function() {
        form.reset();
        studentId.value = "";
        saveButton.textContent = "Add Student";
        cancelButton.hidden = true;
        message.textContent = "";
    });

    // Load records when the page opens
    loadStudents();
</script>
</body>
</html>
